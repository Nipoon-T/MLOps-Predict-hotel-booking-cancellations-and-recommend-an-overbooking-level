name: CI

on:
  push:
    branches:
      - main
      - NHOON
  pull_request:
    branches:
      - main

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff check
        run: |
          ruff check pipeline src/monitoring tests

      - name: Run tests
        run: |
          pytest -q tests --ignore=tests/test_validate.py